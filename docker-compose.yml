services:

  backend:
    build:
      context: ./backend

    container_name: router-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5000:5000"


  frontend:
    build:
      context: ./frontend

    container_name: router-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend
